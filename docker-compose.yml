# Start: docker compose up -d --build --wait   ->  API on http://localhost:8080
# Every value has a default so a clean clone runs with no .env file.
# DAY1_SALT is passed through from the environment only; it is never stored here.

name: league

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-league}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-league-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-league}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 forces TCP so the temporary init server does not count as ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-league}:${POSTGRES_PASSWORD:-league-local-only}@db:5432/${POSTGRES_DB:-league}
      DAY1_SALT: ${DAY1_SALT}
      DAY2_SALT: ${DAY2_SALT}
      JWT_SECRET: ${JWT_SECRET:-change-me-local-only}
      REDIS_HOST: redis
      API_WORKERS: ${API_WORKERS:-8}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      MEDIA_API_URL: http://mediamtx:9997
      # FR-3.2: finished recordings go to S3-compatible storage (MinIO). Unset -> indexed only, no upload.
      MINIO_URL: ${MINIO_URL:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-vod}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
    volumes:
      - recordings:/recordings:ro
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mediamtx:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Self-hosted media server (spec 6.1): RTMP 1935, HLS 8888, WebRTC WHIP/WHEP 8889.
  # Every publish is authorised by the API (/internal/media/auth), so a revoked stream key cannot ingest.
  mediamtx:
    image: bluenviron/mediamtx:1.9.1
    volumes:
      - ./infra/mediamtx.yml:/mediamtx.yml:ro
      - recordings:/recordings
    ports:
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
      - "8189:8189/udp"

  # Selenium Grid 4 (spec 6.2.1): hub + 3 browser nodes, shm 1 GB, VNC off. 4.24.0 images (team decision).
  selenium-hub:
    image: selenium/hub:4.24.0
    container_name: nascon-selenium-hub
    ports:
      - "4444:4444"
      - "4442:4442"
      - "4443:4443"

  node-chrome-1:
    image: selenium/node-chrome:4.24.0
    shm_size: "1gb"
    depends_on: [selenium-hub]
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_START_VNC=false

  node-chrome-2:
    image: selenium/node-chrome:4.24.0
    shm_size: "1gb"
    depends_on: [selenium-hub]
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_START_VNC=false

  node-firefox:
    image: selenium/node-firefox:4.24.0
    shm_size: "1gb"
    depends_on: [selenium-hub]
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_START_VNC=false

volumes:
  pgdata:
  recordings:
